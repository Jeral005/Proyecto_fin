<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Del Personal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center bg-no-repeat flex items-center justify-center min-h-screen p-4 sm:p-6" 
      style="background-image: url('https://adnoticias.mx/wp-content/uploads/2022/11/uaemex-rectoria.jpg');">

<div class="w-full max-w-lg">

  <form id="form-persona" class="bg-white/90 backdrop-blur-sm shadow-xl rounded-lg px-6 pt-6 pb-8 mb-4 sm:px-8 border border-white/20">
    
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Registro de Personal</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
      
      <div class="sm:col-span-2">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="nombre">
          Nombre
        </label>
        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-white" 
               id="nombre" type="text" placeholder="Nombre" required>
      </div>

      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2" for="apellido-paterno">
          Apellido Paterno
        </label>
        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-white" 
               id="apaterno" type="text" placeholder="Apellido Paterno" required>
      </div>

      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2" for="apellido-materno">
          Apellido Materno
        </label>
        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-white" 
               id="amaterno" type="text" placeholder="Apellido Materno" required>
      </div>

    </div>

    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
        Email
      </label>
      <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-white" 
             id="email" type="email" placeholder="Email" required>
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
        Password
      </label>
      <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 mb-2 leading-tight focus:outline-none focus:shadow-outline bg-white" 
             id="password" type="password" placeholder="Password" required>
    </div>

    <div class="flex justify-center">
      <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline w-full sm:w-auto text-center transition-colors" 
              type="submit">
        Enviar
      </button>
    </div>

    <div id="respuesta" class="mt-4 text-center"></div>
    
  </form>
  
  <p class="text-center text-white text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]">
    &copy;2026 UAEMex Facultad de Geografia. Todos los derechos reservados.
  </p>
</div>

<script>
  const form = document.getElementById("form-persona");
  const respuestaDiv = document.getElementById("respuesta");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const datosPersona = {
      nombre: document.getElementById("nombre").value,
      apaterno: document.getElementById("apaterno").value,
      amaterno: document.getElementById("amaterno").value,
      email: document.getElementById("email").value,
      password: document.getElementById("password").value
    };

    try {
      const respuesta = await fetch("https://observatoriogeograficoamericalatina.org.mx/pa-api/crearPersona.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datosPersona)
      });

      const resultado = await respuesta.json();

      respuestaDiv.innerHTML = `
        <p class="bg-green-100 text-green-700 p-2 rounded mt-2 text-sm font-semibold shadow-sm">
          Persona registrada correctamente
        </p>
      `;
      form.reset(); 
    } catch (error) {
      respuestaDiv.innerHTML = `
        <p class="bg-red-100 text-red-700 p-2 rounded mt-2 text-sm font-semibold shadow-sm">
          Error al registrar la persona
        </p>
      `;
    }
  });
</script>

</body>
</html>
